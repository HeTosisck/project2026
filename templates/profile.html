<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ profile_user.username }} - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Workshop Manager</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/my_requests">My Requests</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="{{ url_for('get_avatar', name=profile_user.avatar) }}" alt="Avatar" class="img-fluid rounded-circle" style="max-width: 200px;">
            </div>
            <div class="col-md-8">
                <h2>{{ profile_user.username }}</h2>
                <p><strong>Member since:</strong> {{ profile_user.created_at.strftime('%B %d, %Y') if profile_user.created_at else 'Unknown' }}</p>
                <p><strong>Bio:</strong> {{ profile_user.bio or 'No bio yet.' }}</p>
                {% if current_user.id == profile_user.id %}
                <a href="{{ url_for('edit_profile') }}" class="btn btn-primary">Edit Profile</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
