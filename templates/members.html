<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members - {{ project.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Workshop Manager</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/project/{{ project.id }}">Back to Project</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                    <li class="nav-item"><a class="nav-link" href="/my_requests">My Requests</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Project Members - {{ project.title }}</h2>
        <ul class="list-group mt-3">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <strong>{{ project.owner.username }}</strong> (Owner)
                <span class="badge bg-primary">Owner</span>
            </li>
            {% for member in members %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ member.user.username }}
                {% if is_owner %}
                <form action="/project/{{ project.id }}/remove_member/{{ member.id }}" method="POST" onsubmit="return confirm('Remove this member?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                </form>
                {% else %}
                <span class="badge bg-secondary">Member</span>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
